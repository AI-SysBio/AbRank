# Canonical Experimental 3D Structure Templates for AbRank v2
# Maps:
#   1. `cocrystal_wt_pdbs`: Wild-type `(WT_Abname)` or `(Dataset::WT_Abname)` -> RCSB co-crystal PDB ID
#      containing both the parental antibody/nanobody and cognate antigen in experimental complex.
#   2. `antigen_pdbs`: Canonical `Ag_name` / `Ag_group` -> Experimental RCSB antigen crystal/cryo-EM PDB ID
#      used alongside `IgFold` antibody/VHH structures whenever an Ab-Ag co-crystal does not exist.

cocrystal_wt_pdbs:
  # IgDesign therapeutic co-crystal templates (Shanehsazzadeh et al., 2023)
  Tezepelumab: "5J13"
  Bimagrumab: "5NH3"
  Utomilumab: "6A3W"
  Spesolimab: "6U6U"
  Afasevikumab: "6PPG"
  Eculizumab: "5I5K"
  Osocimab: "6HHC"

  # MAGMA-seq SARS-CoV-2 & Influenza H1 HA co-crystal templates (Kirby et al., 2025; Petersen et al., 2024)
  Kirby_2-15: "7L5B"
  Kirby_C118: "7RKV"
  Kirby_002-S21F2: "7U0P"
  Peterson_222-1C06: "7T3D"

  # FLAb-Shanker Omicron BLI maturation templates (Shanker et al., 2024)
  Ly1404: "7MMO"
  SA58: "7Y0W"

  # AbBiBench multi-antigen PDB suffixes -> 4-char RCSB IDs
  3GBN_H1: "3GBN"
  3GBN_H9: "3GBN"
  4FQI_H1: "4FQI"
  4FQI_H3: "4FQI"

